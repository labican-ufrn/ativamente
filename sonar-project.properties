# ==============================================================================
# SonarQube / SonarCloud Project Configuration — AtivaMente
# ==============================================================================
# Fonte da verdade para identificação e parâmetros do projeto no SonarQube.
# Ref: Issue #36

# Identificação do Projeto
sonar.projectKey=labican-ufrn_ativamente
sonar.projectName=ativamente
sonar.projectVersion=1.0.0

# Codificação
sonar.sourceEncoding=UTF-8

# Diretórios de código fonte e testes
sonar.sources=lib
sonar.tests=test

# Exclusões de análise (espelhando a regra de exclusions em .ypa/review.yml)
# Não avalia testes, código gerado, build artifacts ou opções geradas pelo Firebase.
sonar.exclusions=**/test/**,lib/firebase_options.dart,**/*.g.dart,**/*.freezed.dart,build/**,.dart_tool/**

# Exclusões de cobertura (código gerado/infra não deve penalizar a métrica de testes)
sonar.coverageExclusions=**/test/**,lib/firebase_options.dart,**/*.g.dart,**/*.freezed.dart,build/**,.dart_tool/**

# Relatório de cobertura LCOV gerado por `flutter test --coverage`
# (sonar.dart.lcov.reportPaths é a propriedade oficial do analisador Dart/Flutter)
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.dart.coverage.reportPaths=coverage/lcov.info

# Bloqueio do Quality Gate:
# O scanner aguarda a avaliação das métricas pelo servidor SonarQube.
# Se o Quality Gate falhar no servidor, a pipeline quebra (barra vermelha).
# NOTA: O limiar mínimo de 65% de cobertura e métricas de confiabilidade/segurança
# são configurados no servidor SonarQube em Project Settings > Quality Gate.
# Responsável pela configuração do Quality Gate no servidor: Taciano Silva (Labican).
sonar.qualitygate.wait=true
