name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex.: v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Processando release para a tag $TAG"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate placeholder firebase_options.dart for CI/Build
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat << 'EOF' > lib/firebase_options.dart
          // Placeholder gerado para CI / testes estáticos (não commitar)
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'ci-placeholder-api-key',
                appId: '1:1234567890:android:abcdef',
                messagingSenderId: '1234567890',
                projectId: 'ativamente-ci',
              );
            }
          }
          EOF
          fi

      - name: Static Analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK with Tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ativamente-${TAG}.apk"

      - name: Build Web Release
        run: |
          flutter build web --release
          cd build/web && zip -r ../../ativamente-web-${{ steps.vars.outputs.tag }}.zip . && cd ../..

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${TAG#v}"
          
          # Extrai a seção correspondente entre '## [VERSION]' e a próxima seção '## ['
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "NOTES<<EOF" >> $GITHUB_ENV
              echo "$NOTES" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/ativamente-${{ steps.vars.outputs.tag }}.apk
            build/app/outputs/flutter-apk/app-release.apk
            ativamente-web-${{ steps.vars.outputs.tag }}.zip
