name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex.: v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Resolve Release Tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Processando release para a tag $TAG"

      - name: Validate Release Branch Policy (main only)
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "❌ ERRO: O commit $GITHUB_SHA da tag $RELEASE_TAG não pertence ao histórico da branch 'main'."
            echo "Conforme a política oficial do projeto (AGENTS.md e docs/versionamento-e-releases.md), releases de produção são geradas exclusivamente a partir da main."
            exit 1
          fi

      - name: Provision official Firebase configuration for Release
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s\n' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
            echo "✅ lib/firebase_options.dart provisionado a partir dos segredos do repositório."
          elif [ ! -f lib/firebase_options.dart ]; then
            echo "❌ ERRO: Segredo FIREBASE_OPTIONS_DART não configurado e arquivo lib/firebase_options.dart ausente."
            echo "Para gerar builds de release oficiais funcionais, configure o segredo FIREBASE_OPTIONS_DART nas Settings do repositório."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Web Release
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          flutter build web --release
          cd build/web && zip -r "../../ativamente-web-${RELEASE_TAG}.zip" . && cd ../..

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          
          # Extrai a seção correspondente entre '## [VERSION]' e a próxima seção '## ['
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "NOTES<<EOF" >> "$GITHUB_ENV"
              echo "$NOTES" >> "$GITHUB_ENV"
              echo "EOF" >> "$GITHUB_ENV"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ativamente-web-${{ steps.vars.outputs.tag }}.zip
