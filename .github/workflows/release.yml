name: Release & Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release (ex.: v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Processando release para a tag $TAG"

      - name: Validate Release Branch Policy (main only)
        run: |
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "❌ ERRO: O commit $GITHUB_SHA da tag ${{ steps.vars.outputs.tag }} não pertence ao histórico da branch 'main'."
            echo "Conforme a política oficial do projeto (AGENTS.md e docs/versionamento-e-releases.md), releases de produção são geradas exclusivamente a partir da main."
            exit 1
          fi

      - name: Provision official Firebase configuration for Release
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_DART }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_DART }}" > lib/firebase_options.dart
            echo "✅ lib/firebase_options.dart provisionado a partir dos segredos do repositório."
          elif [ ! -f lib/firebase_options.dart ]; then
            echo "❌ ERRO: Segredo FIREBASE_OPTIONS_DART não configurado e arquivo lib/firebase_options.dart ausente."
            echo "Para gerar builds de release oficiais funcionais, configure o segredo FIREBASE_OPTIONS_DART nas Settings do repositório."
            exit 1
          fi

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
            echo "✅ android/app/google-services.json provisionado a partir dos segredos do repositório."
          elif [ ! -f android/app/google-services.json ]; then
            echo "❌ ERRO: Segredo GOOGLE_SERVICES_JSON não configurado e arquivo android/app/google-services.json ausente."
            echo "Para compilar o APK de produção Android com o plugin Google Services, configure o segredo GOOGLE_SERVICES_JSON nas Settings do repositório."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK with Tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ativamente-${TAG}.apk"

      - name: Build Web Release
        run: |
          flutter build web --release
          cd build/web && zip -r ../../ativamente-web-${{ steps.vars.outputs.tag }}.zip . && cd ../..

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${TAG#v}"
          
          # Extrai a seção correspondente entre '## [VERSION]' e a próxima seção '## ['
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "NOTES<<EOF" >> $GITHUB_ENV
              echo "$NOTES" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: ${{ env.NOTES }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/ativamente-${{ steps.vars.outputs.tag }}.apk
            build/app/outputs/flutter-apk/app-release.apk
            ativamente-web-${{ steps.vars.outputs.tag }}.zip
