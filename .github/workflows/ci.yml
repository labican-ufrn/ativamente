name: CI & SonarQube Quality Gate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 é obrigatório para o SonarQube calcular histórico de commits e blame
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate placeholder firebase_options.dart for CI
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cat << 'EOF' > lib/firebase_options.dart
          // Placeholder gerado para CI / testes estáticos (não commitar)
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'ci-placeholder-api-key',
                appId: '1:1234567890:android:abcdef',
                messagingSenderId: '1234567890',
                projectId: 'ativamente-ci',
              );
            }
          }
          EOF
          fi

      - name: Static Analysis (flutter analyze)
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Fail if SONAR_TOKEN missing on push to main or dev
        if: env.SONAR_TOKEN == '' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          echo "::error title=SONAR_TOKEN obrigatório::O segredo SONAR_TOKEN não está configurado. Pushes para as branches protegidas 'main' e 'dev' exigem análise bloqueante do SonarQube."
          exit 1

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Inform missing SONAR_TOKEN
        if: env.SONAR_TOKEN == '' && !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
        run: |
          echo "::warning title=SONAR_TOKEN ausente::O segredo SONAR_TOKEN não está definido nos segredos do repositório. Para que a análise do SonarQube seja enviada ao servidor, adicione SONAR_TOKEN (e SONAR_HOST_URL se On-Premise) em Settings > Secrets and variables > Actions."
